<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="task-page"><a class="back-link" href="../index.html">← All assignments</a>

        <header class="page-header">
            <div>
                <p class="eyebrow">MY WORKSPACE</p>
                <h1>Daily Tasks</h1>
                <p class="subtitle">
                    Keep track of the things you need to get done.
                </p>
            </div>

            <div class="task-count">
                <span id="taskCount">0</span>
                <small>tasks</small>
            </div>
        </header>

        <section class="task-input-section">
            <label for="taskInput">Add a new task</label>

            <div class="input-row">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                >

                <button id="addTaskButton">
                    Add Task
                </button>
            </div>

            <p id="inputMessage" class="input-message"></p>
        </section>

        <section class="task-list-section">

            <div class="section-heading">
                <h2>Task List</h2>
            </div>

            <div id="taskList" class="task-list">

                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">○</div>
                    <h3>No tasks yet</h3>
                    <p>Add your first task above to get started.</p>
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
